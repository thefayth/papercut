<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">Papercut GitHub banner</title>
  <desc id="desc">Branded Papercut banner with paper, stamp, and workflow motifs.</desc>
  <rect width="1280" height="640" fill="#101010"/>
  <rect x="42" y="42" width="1196" height="556" rx="18" fill="#f6f0e6"/>
