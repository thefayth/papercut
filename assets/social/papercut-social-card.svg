  <rect width="1200" height="630" fill="#f6f0e6"/>
  <rect x="60" y="58" width="1080" height="514" rx="22" fill="#fffaf1" stroke="#101010" stroke-width="5"/>
  <text x="110" y="205" font-family="Arial, sans-serif" font-size="104" font-weight="900" fill="#101010">Papercut</text>
  <text x="116" y="278" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#1f6f8b">Review-first paperwork operations</text>
  <text x="116" y="340" font-family="Arial, sans-serif" font-size="25" fill="#101010">Packets, portals, email, fax, signatures, memory, dispatch gates, and receipts.</text>
